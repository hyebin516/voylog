# 서버를 껐다 켜면 Docker는 restart 정책이 붙은 컨테이너만 되살린다. 전에는
# caddy에만 붙어 있어서, 서버를 켜면 caddy 혼자 올라와 /health가 502를
# 돌려줬다 -- "서버는 켰는데 앱이 안 된다"로 보이는 상태다. 그래서 전부
# unless-stopped다: 사람이 직접 멈춘 게 아니면 다시 올라온다.
#
# The whole stack, for running it the way a server will run it rather than
# as four processes started by hand. The app still reaches the backend over
# `adb reverse tcp:4000`, exactly as it does without Compose.
#
#   docker compose up --build
#
# Secrets come from backend/.env and ai-worker/.env, which are gitignored.
# Copy the .env.example next to each one first.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travel_youtube
    volumes:
      - db-data:/var/lib/postgresql/data
      # Applied in filename order the first time the volume is created, so
      # a fresh stack comes up with the schema already in place.
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travel_youtube"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-worker:
    build: ./ai-worker
    restart: unless-stopped
    env_file: ./ai-worker/.env
    # Deliberately no `ports:`. The worker is reachable from the backend
    # container and from nowhere else -- it has no user accounts and spends
    # money on every call. Publish a port only if you also set
    # AI_WORKER_TOKEN on both sides.
    expose:
      - "8000"

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Override whatever the local .env says: inside Compose these are
      # service names, not localhost.
      DATABASE_URL: postgres://postgres:postgres@db:5432/travel_youtube
      REDIS_URL: redis://redis:6379
      AI_WORKER_URL: http://ai-worker:8000
      NODE_ENV: production
      # Caddy sits in front, so req.ip comes from X-Forwarded-For. Without
      # this every user shares one rate-limit bucket and gets blocked
      # together.
      TRUST_PROXY: 1
    # No `ports:` any more. The only way in is Caddy on 443, so the
    # backend is never reachable over plain HTTP from outside.
    expose:
      - "4000"
    volumes:
      # Profile photos survive a rebuild; without this they vanish with the
      # container, and every avatar 404s.
      - uploads:/app/uploads
      # 공공데이터 원본(상가정보 zip). 이미지에는 backend/만 들어가므로
      # database/seed-data는 컨테이너 안에 없다. refresh-public-places.js가
      # backend/scripts 기준 ../../database/seed-data를 보므로 /database로
      # 올려 붙인다. 읽기 전용 -- 스크립트는 읽기만 한다.
      - ./database/seed-data:/database/seed-data:ro
      # FCM 서비스 계정 키. 이미지에 굽지 않고 붙인다 -- 비밀키가 이미지
      # 레이어에 남으면 이미지를 가진 사람이 곧 키를 가진 것이 된다.
      # 이 파일이 없으면 푸시는 경고 한 줄 남기고 조용히 꺼진다.
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-worker:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # DOMAIN comes from backend/.env (e.g. voylog.duckdns.org). Let's
    # Encrypt issues a certificate for it on first start, which is why 80
    # has to be open as well as 443 -- the HTTP challenge uses it.
    env_file: ./backend/.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Without this volume every restart asks
      # Let's Encrypt for a new one and hits their rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
