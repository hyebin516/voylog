name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  ai-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ai-worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: travel_youtube_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
      - run: flutter pub get
      - run: cp .env.example .env # mirrors local setup; .env is a declared pubspec asset
      - run: flutter analyze
      - run: flutter test

  # iOS can only be compiled on macOS, and nobody on the team develops on
  # one -- so CI is the only place the iOS target is ever built. Runs
  # without signing (no certificates in CI) and without Firebase: the
  # Kakao key (ios/Flutter/KakaoKeys.xcconfig) and GoogleService-Info.plist
  # are git-ignored, and both are optional includes so the build works
  # without them. It catches broken plugin/pod setup, not runtime behavior.
  ios-build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: travel_youtube_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
      - run: flutter pub get
      - run: cp .env.example .env
      - run: flutter build ios --no-codesign
